<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" font-family="Yu Gothic UI, Meiryo, Noto Sans JP, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/>
    </marker>
    <style>
      .box{fill:#fff;stroke-width:2.5}
      .run{stroke:#1a73e8}.data{stroke:#188038}.ai{stroke:#9334e6}.sec{stroke:#80868b}.user{stroke:#e37400}
      .prod{font-size:15px;fill:#5f6368}
      .name{font-size:22px;font-weight:700;fill:#202124}
      .desc{font-size:15px;fill:#3c4043}
      .lbl{font-size:15px;fill:#3c4043}
      .step{font-size:15px;font-weight:700;fill:#1a73e8}
      .ln{fill:none;stroke:#5f6368;stroke-width:2.2}
      .dash{stroke-dasharray:7 5}
    </style>
  </defs>
  <rect width="1600" height="960" fill="#ffffff"/>

  <text x="40" y="58" font-size="32" font-weight="700" fill="#202124">Med-Ops Orchestrator システム構成</text>
  <text x="40" y="90" font-size="17" fill="#5f6368">医師の自然言語の指示で、Gemini が PACS・GPU 解析・DB を横断して「画像取得 → 大動脈計測 → DB 登録」を自律的に実行する</text>

  <!-- region -->
  <rect x="270" y="120" width="1000" height="760" rx="16" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/>
  <text x="290" y="150" font-size="17" font-weight="700" fill="#5f6368">Google Cloud ― asia-southeast1</text>

  <!-- user -->
  <rect class="box user" x="30" y="330" width="200" height="150" rx="12"/>
  <text class="prod" x="50" y="360">ブラウザ</text>
  <text class="name" x="50" y="392">医師・審査員</text>
  <text class="desc" x="50" y="422">ID / パスワードで</text>
  <text class="desc" x="50" y="444">ログイン</text>

  <!-- UI -->
  <rect class="box run" x="320" y="170" width="460" height="140" rx="12"/>
  <text class="prod" x="340" y="198">Cloud Run</text>
  <text class="name" x="340" y="228">medops-ui（Streamlit）</text>
  <text class="desc" x="340" y="256">左: 統計ダッシュボード（自動更新・CSV）</text>
  <text class="desc" x="340" y="280">右: 指令box（Gemini エージェント）・解析画面</text>

  <!-- Vertex -->
  <rect class="box ai" x="1310" y="160" width="260" height="160" rx="12"/>
  <text class="prod" x="1330" y="188">Vertex AI（asia-northeast1）</text>
  <text class="name" x="1330" y="220">Gemini</text>
  <text class="desc" x="1330" y="248">function calling で</text>
  <text class="desc" x="1330" y="270">使うツールと引数を判断</text>
  <text class="desc" x="1330" y="292">（計算・パス解決はしない）</text>

  <!-- API -->
  <rect class="box run" x="320" y="400" width="460" height="150" rx="12"/>
  <text class="prod" x="340" y="428">Cloud Run（IAM 保護・常時 1 インスタンス）</text>
  <text class="name" x="340" y="458">medops-api（ジョブサーバー）</text>
  <text class="desc" x="340" y="486">FastAPI。GPU 同時実行 1・1 日 10 件まで</text>
  <text class="desc" x="340" y="510">パス解決・DICOM→NIfTI 変換（幾何チェック）</text>
  <text class="desc" x="340" y="534">進捗・トレーサビリティの記録</text>

  <!-- Secret Manager -->
  <rect class="box sec" x="840" y="420" width="400" height="110" rx="12"/>
  <text class="prod" x="860" y="448">Secret Manager</text>
  <text class="desc" x="860" y="476">ログインのパスワードハッシュ（scrypt）</text>
  <text class="desc" x="860" y="500">PACS アカウント・DB パスワード</text>

  <!-- bottom row -->
  <rect class="box run" x="300" y="640" width="210" height="200" rx="12"/>
  <text class="prod" x="318" y="668">Cloud Run</text>
  <text class="name" x="318" y="698">medops-pacs</text>
  <text class="desc" x="318" y="726">Orthanc（PACS）</text>
  <text class="desc" x="318" y="750">Stone Web Viewer</text>
  <text class="desc" x="318" y="774">書き込みは API のみ</text>
  <text class="desc" x="318" y="798">審査員は閲覧専用</text>

  <rect class="box data" x="540" y="640" width="210" height="200" rx="12"/>
  <text class="prod" x="558" y="668">Cloud SQL</text>
  <text class="name" x="558" y="698">PostgreSQL</text>
  <text class="desc" x="558" y="726">解析結果</text>
  <text class="desc" x="558" y="750">（症例 × 椎体レベル）</text>
  <text class="desc" x="558" y="774">実行メタデータ</text>
  <text class="desc" x="558" y="798">Orthanc の索引</text>

  <rect class="box run" x="780" y="640" width="210" height="200" rx="12"/>
  <text class="prod" x="798" y="668">Cloud Run Jobs</text>
  <text class="name" x="798" y="698">medops-gpu</text>
  <text class="desc" x="798" y="726">NVIDIA L4 ×1</text>
  <text class="desc" x="798" y="750">3D Slicer headless</text>
  <text class="desc" x="798" y="774">+ AorticPipeline</text>
  <text class="desc" x="798" y="798">解析中だけ起動</text>

  <rect class="box data" x="1020" y="640" width="210" height="200" rx="12"/>
  <text class="prod" x="1038" y="668">Cloud Storage</text>
  <text class="name" x="1038" y="698">データ</text>
  <text class="desc" x="1038" y="726">NIfTI・計測結果</text>
  <text class="desc" x="1038" y="750">解析画面・シーン</text>
  <text class="desc" x="1038" y="774">学習済み重み</text>
  <text class="desc" x="1038" y="798">（非公開）</text>

  <!-- connections -->
  <path class="ln" d="M230,385 L320,240" marker-end="url(#a)" marker-start="url(#a)"/>
  <text class="step" x="196" y="300">①</text>
  <text class="lbl" x="220" y="300">指示</text>

  <path class="ln" d="M780,230 L1310,230" marker-end="url(#a)" marker-start="url(#a)"/>
  <text class="step" x="800" y="218">②</text>
  <text class="lbl" x="826" y="218">ツール選択（function calling）</text>
  <text class="lbl" x="800" y="256">渡すのは匿名化 ID・検査日・モダリティ・数値のみ</text>

  <path class="ln" d="M550,310 L550,400" marker-end="url(#a)"/>
  <text class="lbl" x="562" y="350">ツール実行</text>
  <text class="step" x="562" y="374">③</text>
  <text class="lbl" x="588" y="374">解析は確認後に投入</text>

  <path class="ln" d="M550,550 L550,600"/>
  <path class="ln" d="M405,600 L1125,600"/>
  <path class="ln" d="M405,600 L405,640" marker-end="url(#a)"/>
  <path class="ln" d="M645,600 L645,640" marker-end="url(#a)"/>
  <path class="ln" d="M885,600 L885,640" marker-end="url(#a)"/>
  <path class="ln" d="M1125,600 L1125,640" marker-end="url(#a)"/>
  <text class="step" x="414" y="628">④</text><text class="lbl" x="438" y="628">取得</text>
  <text class="step" x="654" y="628">⑥</text><text class="lbl" x="678" y="628">登録</text>
  <text class="step" x="894" y="628">⑤</text><text class="lbl" x="918" y="628">計測</text>
  <text class="lbl" x="1134" y="628">入出力</text>
  <path class="ln dash" d="M992,740 L1018,740" marker-end="url(#a)" marker-start="url(#a)"/>

  <path class="ln dash" d="M130,480 L130,740 L300,740" marker-end="url(#a)"/>
  <text class="lbl" x="142" y="600">PACS ビューアを</text>
  <text class="lbl" x="142" y="622">直接開く</text>

  <path class="ln dash" d="M1125,840 L1125,912 L70,912 L70,480" marker-end="url(#a)"/>
  <text class="lbl" x="420" y="940">署名付きリンク（有効 15 分）で 3D Slicer のシーンを直接ダウンロード</text>

  <!-- flow legend -->
  <rect x="1310" y="380" width="260" height="460" rx="12" fill="#e8f0fe" stroke="#d2e3fc" stroke-width="2"/>
  <text x="1330" y="414" font-size="19" font-weight="700" fill="#202124">処理の流れ</text>
  <g font-size="15" fill="#202124">
    <text x="1330" y="452"><tspan class="step">①</tspan> 指令box に日本語で指示</text>
    <text x="1330" y="500"><tspan class="step">②</tspan> Gemini がツールと</text>
    <text x="1356" y="522">引数（症例 ID・レベル）を選ぶ</text>
    <text x="1330" y="570"><tspan class="step">③</tspan> 件数と所要時間を示し</text>
    <text x="1356" y="592">同意を得てからジョブ投入</text>
    <text x="1330" y="640"><tspan class="step">④</tspan> PACS から取得・変換</text>
    <text x="1356" y="662">（複数シリーズは解析を拒否）</text>
    <text x="1330" y="710"><tspan class="step">⑤</tspan> GPU で大動脈を計測</text>
    <text x="1356" y="732">（1 症例 約 12〜16 分）</text>
    <text x="1330" y="780"><tspan class="step">⑥</tspan> DB 登録 →</text>
    <text x="1356" y="802">ダッシュボード自動更新</text>
  </g>
</svg>
